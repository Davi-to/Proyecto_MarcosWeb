<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Korvia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body class="bg-light">
    <!-- Navegación -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top mb-4">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">
                <i class="bi bi-pc-display me-2"></i>Korvia
            </a>
            <!-- Botón hamburguesa para dispositivos móviles -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" data-bs-toggle="modal"
                            data-bs-target="#accountModal">Mi cuenta</a></li>

                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="text-center mb-5">
            <h2>Contáctanos</h2>
            <p class="lead text-muted">¿Tienes alguna duda sobre nuestros equipos? Escríbenos.</p>
        </div>

        <div class="row g-4">

            <div class="col-md-7">
                <div class="card shadow-sm h-100">
                    <div class="card-body p-4">
                        <h4 class="mb-4">Envíanos un mensaje</h4>
                        <form>
                            <div class="row">
                                <div class="col-sm-6 mb-3">
                                    <label for="nombreCont" class="form-label">Nombre</label>
                                    <input type="text" class="form-control" id="nombreCont" placeholder="Ej. Juan"
                                        required>
                                </div>
                                <div class="col-sm-6 mb-3">
                                    <label for="apellidoCont" class="form-label">Apellido</label>
                                    <input type="text" class="form-control" id="apellidoCont" placeholder="Ej. Pérez"
                                        required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="emailCont" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="emailCont"
                                    placeholder="tucorreo@ejemplo.com" required>
                            </div>
                            <div class="mb-3">
                                <label for="mensaje" class="form-label">Mensaje</label>
                                <textarea class="form-control" id="mensaje" rows="4"
                                    placeholder="Escribe tu consulta aquí..." required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary"><i class="bi bi-send me-2"></i>Enviar
                                Mensaje</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-5">
                <div class="card shadow-sm h-100 bg-dark text-white">
                    <div class="card-body p-4">
                        <h4 class="mb-4">Información de Contacto</h4>

                        <!-- Listas sin viñetas (list-unstyled) para mostrar datos de contacto limpios -->
                        <ul class="list-unstyled mb-4">
                            <li class="d-flex align-items-center mb-3 fs-5">
                                <i class="bi bi-geo-alt-fill text-primary me-3 fs-3"></i>
                                <span>Av. Arequipa 265, Lima</span>
                            </li>
                            <li class="d-flex align-items-center mb-3 fs-5">
                                <i class="bi bi-telephone-fill text-primary me-3 fs-3"></i>
                                <span>+51 987 654 321</span>
                            </li>
                            <li class="d-flex align-items-center mb-3 fs-5">
                                <i class="bi bi-envelope-fill text-primary me-3 fs-3"></i>
                                <span>soporte@korvia.pe</span>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Modal Mi cuenta -->
    <!-- Modal Mi cuenta -->
    <div class="modal fade" id="accountModal" tabindex="-1">
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Mi cuenta</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class=" modal-body text-center">
                    <a href="login.html" class="btn btn-primary w-100 mb-3">Iniciar Sesión</a>
                    <a href="registro.html" class="btn btn-outline-secondary w-100">Registrarme</a>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
