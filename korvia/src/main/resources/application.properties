spring.application.name=korvia
server.port=8080

# Thymeleaf - desactiva caché para ver cambios en vivo
spring.thymeleaf.cache=false

# ============================================================
# Conexión a MySQL
# La contraseña NO se escribe en el repositorio: se lee de la
# variable de entorno DB_PASSWORD.
# Ejemplo en PowerShell antes de arrancar:
#   $env:DB_PASSWORD='tu_password_local'
# ============================================================
spring.datasource.url=jdbc:mysql://localhost:3306/korvia?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================================
# JPA / Hibernate
# ddl-auto=update crea y actualiza las tablas a partir de las entidades.
# El script database/korvia.sql queda como entregable y referencia.
# ============================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Evita consultas implícitas durante el renderizado de Thymeleaf.
# Las relaciones que usan las vistas son EAGER o se proyectan a DTO.
spring.jpa.open-in-view=false

# No ejecutar schema.sql ni data.sql automáticamente: el esquema lo
# administra Hibernate y los datos iniciales los carga DataInitializer.
spring.sql.init.mode=never
