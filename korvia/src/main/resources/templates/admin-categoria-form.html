<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Categoría Admin')}"></head>

<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-4">
        <a th:href="@{/admin/categorias}" class="btn btn-outline-secondary mb-4">
            <i class="bi bi-arrow-left me-1"></i>Volver a categorías
        </a>

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h2 class="fw-bold mb-4">
                    <i class="bi bi-tag text-primary me-2"></i>
                    <span th:text="${modo == 'nuevo' ? 'Nueva categoría' : 'Editar categoría'}">Categoría</span>
                </h2>

                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <form th:action="@{${formAction}}" th:object="${categoriaForm}" method="post" novalidate>
                    <div class="row g-3">
                        <div class="col-md-7">
                            <label class="form-label">Nombre *</label>
                            <input type="text" class="form-control" th:field="*{nombre}"
                                placeholder="Ej: Laptop Gamer"
                                th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('nombre')}"
                                th:errors="*{nombre}"></div>
                        </div>
                        <div class="col-md-5">
                            <label class="form-label">Código *</label>
                            <input type="text" class="form-control" th:field="*{codigo}"
                                placeholder="Ej: laptop-gamer"
                                th:classappend="${#fields.hasErrors('codigo')} ? 'is-invalid'">
                            <small class="text-muted">Solo letras, números y guiones. Se usa en las URLs
                                del catálogo.</small>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('codigo')}"
                                th:errors="*{codigo}"></div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a th:href="@{/admin/categorias}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save me-1"></i>Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/modal-cuenta :: modalCuenta}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
