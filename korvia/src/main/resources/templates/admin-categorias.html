<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Categorías')}"></head>

<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-4">
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 mb-4">
            <div>
                <a th:href="@{/administracion}" class="btn btn-outline-secondary btn-sm mb-3">
                    <i class="bi bi-arrow-left me-1"></i>Volver al panel
                </a>
                <p class="text-primary fw-semibold mb-1">CATÁLOGO</p>
                <h1 class="h2 mb-0"><i class="bi bi-tags me-2"></i>Gestión de Categorías</h1>
            </div>
            <a th:href="@{/admin/categoria/nuevo}" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i>Nueva categoría
            </a>
        </div>

        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle me-2"></i>
            <span th:text="${mensaje}">Mensaje</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-triangle me-2"></i>
            <span th:text="${error}">Error</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-header bg-white">
                <h2 class="h5 mb-0">Categorías registradas</h2>
            </div>

            <div th:if="${categorias.isEmpty()}" class="card-body text-center py-5">
                <i class="bi bi-tags fs-1 text-muted d-block mb-3"></i>
                <p class="text-muted mb-0">Todavía no hay categorías registradas.</p>
            </div>

            <div th:unless="${categorias.isEmpty()}" class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nombre</th>
                            <th>Código</th>
                            <th class="text-center">Productos</th>
                            <th class="text-center">Stock total</th>
                            <th class="text-center">Reservado</th>
                            <th class="text-center">Disponible</th>
                            <th class="text-center">Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c : ${categorias}">
                            <td th:text="${c.id}">1</td>
                            <td><strong th:text="${c.nombre}">Nombre</strong></td>
                            <td><code th:text="${c.codigo}">codigo</code></td>
                            <td class="text-center" th:text="${c.totalProductos}">0</td>
                            <td class="text-center" th:text="${c.stockTotal}">0</td>
                            <td class="text-center" th:text="${c.reservadoTotal}">0</td>
                            <td class="text-center">
                                <span class="badge bg-success" th:text="${c.stockDisponibleTotal}">0</span>
                            </td>
                            <td class="text-center">
                                <a th:href="@{/admin/categoria/editar/{id}(id=${c.id})}"
                                    class="btn btn-sm btn-outline-primary" title="Editar">
                                    <i class="bi bi-pencil"></i>
                                </a>
                                <form th:action="@{/admin/categoria/eliminar/{id}(id=${c.id})}" method="post"
                                    class="d-inline"
                                    onsubmit="return confirm('¿Eliminar esta categoría? Solo se puede si no tiene productos.');">
                                    <button type="submit" class="btn btn-sm btn-outline-danger" title="Eliminar">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/modal-cuenta :: modalCuenta}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
