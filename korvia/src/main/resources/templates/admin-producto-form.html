<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Producto Admin')}"></head>

<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-4">
        <a th:href="@{/administracion}" class="btn btn-outline-secondary mb-4">
            <i class="bi bi-arrow-left me-1"></i>Volver al panel
        </a>

        <div class="card shadow-sm border-0">
            <div class="card-body p-4">
                <h2 class="fw-bold mb-4">
                    <i class="bi bi-box-seam text-primary me-2"></i>
                    <span th:text="${modo == 'nuevo' ? 'Nuevo producto' : 'Editar producto'}">Producto</span>
                </h2>

                <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

                <form th:action="@{${formAction}}" th:object="${productoForm}" method="post" novalidate>

                    <div class="row g-3">
                        <div class="col-md-8">
                            <label class="form-label">Nombre *</label>
                            <input type="text" class="form-control" th:field="*{nombre}"
                                th:classappend="${#fields.hasErrors('nombre')} ? 'is-invalid'">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('nombre')}"
                                th:errors="*{nombre}"></div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label">Categoría *</label>
                            <select class="form-select" th:field="*{categoriaId}" id="categoriaId"
                                th:classappend="${#fields.hasErrors('categoriaId')} ? 'is-invalid'"
                                onchange="toggleEspecificaciones()">
                                <option value="">Selecciona una categoría</option>
                                <option th:each="cat : ${categorias}" th:value="${cat.id}"
                                    th:text="${cat.nombre}">Categoría</option>
                            </select>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('categoriaId')}"
                                th:errors="*{categoriaId}"></div>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label">Precio (S/) *</label>
                            <input type="number" step="0.01" min="0" class="form-control" th:field="*{precio}"
                                th:classappend="${#fields.hasErrors('precio')} ? 'is-invalid'">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('precio')}"
                                th:errors="*{precio}"></div>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Stock *</label>
                            <input type="number" min="0" class="form-control" th:field="*{stock}"
                                th:classappend="${#fields.hasErrors('stock')} ? 'is-invalid'">
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('stock')}"
                                th:errors="*{stock}"></div>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Imagen (nombre de archivo) *</label>
                            <input type="text" class="form-control" th:field="*{imagen}"
                                placeholder="ej: 1-pc-basico-oficina.jpg"
                                th:classappend="${#fields.hasErrors('imagen')} ? 'is-invalid'">
                            <small class="text-muted">El archivo debe estar en
                                <code>static/img/productos/</code></small>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('imagen')}"
                                th:errors="*{imagen}"></div>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Descripción corta *</label>
                            <textarea rows="2" class="form-control" th:field="*{descripcion}"
                                th:classappend="${#fields.hasErrors('descripcion')} ? 'is-invalid'"></textarea>
                            <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('descripcion')}"
                                th:errors="*{descripcion}"></div>
                        </div>

                        <div class="col-12">
                            <label class="form-label">Descripción larga (acepta HTML: &lt;strong&gt;,
                                &lt;em&gt;)</label>
                            <textarea rows="4" class="form-control" th:field="*{descripcionLarga}"></textarea>
                        </div>

                        <div class="col-12" id="specs">
                            <hr>
                            <h6 class="fw-bold" id="tituloSpecs">Especificaciones técnicas</h6>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label" id="labelCpu">CPU / Tipo</label>
                                    <input type="text" class="form-control" th:field="*{cpu}"
                                        placeholder="Intel Core i5 12400">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" id="labelRam">RAM / Capacidad</label>
                                    <input type="text" class="form-control" th:field="*{ram}"
                                        placeholder="16GB DDR4">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" id="labelAlm">Almacenamiento / Detalle</label>
                                    <input type="text" class="form-control" th:field="*{almacenamiento}"
                                        placeholder="512GB SSD">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" id="labelGpu">GPU / Extra</label>
                                    <input type="text" class="form-control" th:field="*{gpu}"
                                        placeholder="NVIDIA RTX 3060">
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-end gap-2 mt-4">
                        <a th:href="@{/administracion}" class="btn btn-secondary">Cancelar</a>
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-save me-1"></i>Guardar
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/modal-cuenta :: modalCuenta}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const categoriasComponente = ['component'];

        function toggleEspecificaciones() {
            const select = document.getElementById('categoriaId');
            const esComponente = select && categoriasComponente.includes(select.value);

            const titulo = document.getElementById('tituloSpecs');
            const labelCpu = document.getElementById('labelCpu');
            const labelRam = document.getElementById('labelRam');
            const labelAlm = document.getElementById('labelAlm');
            const labelGpu = document.getElementById('labelGpu');

            if (esComponente) {
                titulo.textContent = 'Especificaciones del componente';
                labelCpu.textContent = 'Tipo';
                labelRam.textContent = 'Capacidad / Formato';
                labelAlm.textContent = 'Velocidad / Detalle';
                labelGpu.textContent = 'Extra';
            } else {
                titulo.textContent = 'Especificaciones técnicas';
                labelCpu.textContent = 'CPU / Tipo';
                labelRam.textContent = 'RAM / Capacidad';
                labelAlm.textContent = 'Almacenamiento / Detalle';
                labelGpu.textContent = 'GPU / Extra';
            }
        }

        document.addEventListener('DOMContentLoaded', toggleEspecificaciones);
    </script>
</body>

</html>
