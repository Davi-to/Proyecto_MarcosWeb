<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Carrito')}"></head>

<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-5">
        <h1 class="mb-4"><i class="bi bi-cart3 me-2"></i>Mi Carrito</h1>

        <!-- Mensajes -->
        <div th:if="${mensaje}" class="alert alert-success alert-dismissible fade show">
            <i class="bi bi-check-circle me-2"></i>
            <span th:text="${mensaje}">Mensaje</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
        <div th:if="${error}" class="alert alert-danger alert-dismissible fade show">
            <i class="bi bi-exclamation-triangle me-2"></i>
            <span th:text="${error}">Error</span>
            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>

        <!-- Carrito vacío -->
        <div th:if="${items.isEmpty()}" class="alert alert-info text-center py-5">
            <i class="bi bi-cart-x fs-1 d-block mb-3"></i>
            <h4>Tu carrito está vacío</h4>
            <p>Explora nuestro catálogo y agrega productos.</p>
            <a th:href="@{/catalogo}" class="btn btn-primary mt-3">
                <i class="bi bi-grid-fill me-2"></i>Ir al Catálogo
            </a>
        </div>

        <!-- Carrito con items -->
        <div th:unless="${items.isEmpty()}" class="card shadow-sm border-0">
            <div class="table-responsive">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Producto</th>
                            <th class="text-end">Precio</th>
                            <th class="text-center">Cantidad</th>
                            <th class="text-end">Subtotal</th>
                            <th class="text-center">Acción</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${items}">
                            <td>
                                <div class="d-flex align-items-center">
                                    <img th:src="@{/img/productos/{img}(img=${item.producto.imagen})}"
                                        th:alt="${item.producto.nombre}"
                                        style="width: 60px; height: 60px; object-fit: cover;" class="rounded me-3">
                                    <div>
                                        <strong th:text="${item.producto.nombre}">Nombre</strong>
                                        <br>
                                        <small class="text-muted"
                                            th:text="${item.producto.categoria.nombre}">Categoría</small>
                                    </div>
                                </div>
                            </td>
                            <td class="text-end" th:text="'S/ ' + ${item.producto.precio}">S/ 0.00</td>
                            <td class="text-center" th:text="${item.cantidad}">1</td>
                            <td class="text-end fw-bold" th:text="'S/ ' + ${item.subtotal}">S/ 0.00</td>
                            <td class="text-center">
                                <form th:action="@{/carrito/quitar}" method="post" class="d-inline">
                                    <input type="hidden" name="productoId" th:value="${item.producto.id}">
                                    <button type="submit" class="btn btn-sm btn-outline-danger"
                                        title="Quitar del carrito">
                                        <i class="bi bi-trash"></i>
                                    </button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                    <tfoot class="table-light">
                        <tr>
                            <td colspan="3" class="text-end fw-bold fs-5">Subtotal:</td>
                            <td class="text-end fw-bold fs-5" th:text="'S/ ' + ${total}">S/ 0.00</td>
                            <td></td>
                        </tr>
                        <tr>
                            <td colspan="3" class="text-end fw-bold">IGV (18%):</td>
                            <td class="text-end fw-bold" th:text="'S/ ' + ${total * 0.18}">S/ 0.00</td>
                            <td></td>
                        </tr>
                        <tr>
                            <td colspan="3" class="text-end fw-bold fs-5">Total:</td>
                            <td class="text-end fw-bold fs-5 text-primary" th:text="'S/ ' + ${total * 1.18}">S/ 0.00
                            </td>
                            <td></td>
                        </tr>
                    </tfoot>
                </table>
            </div>
            <div class="card-footer d-flex flex-column flex-md-row justify-content-between gap-2">
                <form th:action="@{/carrito/vaciar}" method="post"
                    onsubmit="return confirm('¿Vaciar todo el carrito?');">
                    <button type="submit" class="btn btn-outline-secondary">
                        <i class="bi bi-x-circle me-1"></i>Vaciar carrito
                    </button>
                </form>
                <div class="d-flex gap-2 flex-wrap">
                    <a th:href="@{/catalogo}" class="btn btn-outline-primary">
                        <i class="bi bi-arrow-left me-1"></i>Seguir comprando
                    </a>
                    <a th:href="@{/cotizacion/solicitar}" class="btn btn-warning">
                        <i class="bi bi-file-earmark-text me-1"></i>Solicitar cotización
                    </a>
                    <a th:href="@{/checkout}" class="btn btn-success">
                        <i class="bi bi-bag-check me-1"></i>Finalizar compra
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/modal-cuenta :: modalCuenta}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
