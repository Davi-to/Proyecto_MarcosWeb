<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Catálogo')}"></head>

<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <h2 class="mb-0">Catálogo de Equipos</h2>
            <div class="btn-group flex-wrap" role="group">
                <a th:href="@{/catalogo(categoria='all')}" class="btn btn-outline-primary"
                    th:classappend="${categoriaActual == 'all'} ? 'active'">Todos</a>
                <a th:href="@{/catalogo(categoria='desktop')}" class="btn btn-outline-primary"
                    th:classappend="${categoriaActual == 'desktop'} ? 'active'">PC Escritorio</a>
                <a th:href="@{/catalogo(categoria='laptop')}" class="btn btn-outline-primary"
                    th:classappend="${categoriaActual == 'laptop'} ? 'active'">Laptops</a>
                <a th:href="@{/catalogo(categoria='all-in-one')}" class="btn btn-outline-primary"
                    th:classappend="${categoriaActual == 'all-in-one'} ? 'active'">All-in-One</a>
                <a th:href="@{/catalogo(categoria='component')}" class="btn btn-outline-primary"
                    th:classappend="${categoriaActual == 'component'} ? 'active'">Componentes</a>
            </div>
        </div>

        <div class="row g-4" th:if="${!productos.isEmpty()}">
            <div class="col-12 col-md-6 col-lg-4" th:each="producto : ${productos}">
                <div class="card h-100 featured-card shadow-sm">
                    <div class="featured-card-img-wrapper">
                        <span class="badge bg-primary badge-featured"
                            th:text="${producto.categoria.nombre}">Categoría</span>
                        <img th:src="@{/img/productos/{img}(img=${producto.imagen})}" th:alt="${producto.nombre}">
                    </div>
                    <div class="card-body d-flex flex-column text-center p-4">
                        <h5 class="card-title fw-bold mb-1" th:text="${producto.nombre}">Nombre</h5>
                        <p class="text-muted small flex-grow-1" th:text="${producto.descripcion}">Descripción</p>
                        <div class="mb-3">
                            <span class="text-primary fw-bold fs-5" th:text="'S/ ' + ${producto.precio}">S/ 0.00</span>
                        </div>
                        <div class="d-flex gap-2 mt-auto">
                            <a th:href="@{/catalogo/detalle/{id}(id=${producto.id})}"
                                class="btn btn-outline-primary flex-fill">
                                <i class="bi bi-eye me-1"></i>Ver
                            </a>
                            <form th:action="@{/carrito/agregar}" method="post" class="flex-fill">
                                <input type="hidden" name="productoId" th:value="${producto.id}">
                                <input type="hidden" name="cantidad" value="1">
                                <button type="submit" class="btn btn-success w-100"
                                    th:disabled="${!producto.disponible}">
                                    <i class="bi bi-cart-plus me-1"></i>Añadir
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <div th:if="${productos.isEmpty()}" class="alert alert-info mt-4">
            No se encontraron productos en esta categoría.
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/modal-cuenta :: modalCuenta}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
