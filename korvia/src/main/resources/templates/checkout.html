<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Checkout')}"></head>

<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-4">
        <a th:href="@{/carrito}" class="btn btn-outline-secondary mb-4">
            <i class="bi bi-arrow-left me-1"></i>Volver al carrito
        </a>

        <h1 class="mb-4"><i class="bi bi-credit-card me-2"></i>Finalizar Compra</h1>

        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="row g-4">
            <!-- Formulario -->
            <div class="col-lg-7">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3">Datos de facturación</h5>

                        <form th:action="@{/checkout/pagar}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Nombre completo *</label>
                                <input type="text" name="clienteNombre" class="form-control" required minlength="3">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Correo electrónico *</label>
                                <input type="email" name="clienteEmail" class="form-control" required>
                            </div>

                            <hr class="my-4">
                            <h6 class="fw-bold mb-3">Método de pago (simulado)</h6>

                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="metodoPago" id="pagoTarjeta"
                                    value="Tarjeta de crédito" checked>
                                <label class="form-check-label" for="pagoTarjeta">
                                    <i class="bi bi-credit-card me-1"></i>Tarjeta de crédito/débito
                                </label>
                            </div>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" name="metodoPago" id="pagoTransferencia"
                                    value="Transferencia bancaria">
                                <label class="form-check-label" for="pagoTransferencia">
                                    <i class="bi bi-bank me-1"></i>Transferencia bancaria
                                </label>
                            </div>
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="radio" name="metodoPago" id="pagoEfectivo"
                                    value="Efectivo">
                                <label class="form-check-label" for="pagoEfectivo">
                                    <i class="bi bi-cash-coin me-1"></i>Efectivo (pago en tienda)
                                </label>
                            </div>

                            <div class="alert alert-info small">
                                <i class="bi bi-info-circle me-1"></i>
                                Esta es una <strong>simulación</strong>. No se procesará ningún pago real.
                            </div>

                            <button type="submit" class="btn btn-success btn-lg w-100">
                                <i class="bi bi-check-circle me-2"></i>Confirmar compra
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Resumen -->
            <div class="col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3">Resumen del pedido</h5>

                        <ul class="list-group list-group-flush mb-3">
                            <li class="list-group-item d-flex justify-content-between px-0" th:each="item : ${items}">
                                <span>
                                    <span th:text="${item.producto.nombre}">Producto</span>
                                    <small class="text-muted" th:text="' x' + ${item.cantidad}">x1</small>
                                </span>
                                <strong th:text="'S/ ' + ${item.subtotal}">S/ 0.00</strong>
                            </li>
                        </ul>

                        <div class="d-flex justify-content-between mb-2">
                            <span>Subtotal</span>
                            <strong th:text="'S/ ' + ${total}">S/ 0.00</strong>
                        </div>
                        <div class="d-flex justify-content-between mb-3">
                            <span>IGV (18%)</span>
                            <strong th:text="'S/ ' + ${total * 0.18}">S/ 0.00</strong>
                        </div>
                        <hr>
                        <div class="d-flex justify-content-between fs-4">
                            <span class="fw-bold">Total</span>
                            <span class="fw-bold text-primary" th:text="'S/ ' + ${total * 1.18}">S/ 0.00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/modal-cuenta :: modalCuenta}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
