<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Solicitar Cotización')}"></head>

<body class="bg-light">

    <div th:replace="~{fragments/navbar :: navbar}"></div>

    <div class="container py-4">
        <a th:href="@{/carrito}" class="btn btn-outline-secondary mb-4">
            <i class="bi bi-arrow-left me-1"></i>Volver al carrito
        </a>

        <h1 class="mb-4"><i class="bi bi-file-earmark-text me-2"></i>Solicitar Cotización</h1>

        <div class="row g-4">
            <div class="col-lg-7">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3">Datos del cliente</h5>

                        <form th:action="@{/cotizacion/generar}" method="post">
                            <div class="mb-3">
                                <label class="form-label">Nombre completo *</label>
                                <input type="text" name="clienteNombre" class="form-control" required minlength="3">
                            </div>
                            <div class="mb-3">
                                <label class="form-label">Correo electrónico *</label>
                                <input type="email" name="clienteEmail" class="form-control" required>
                            </div>

                            <div class="alert alert-info small">
                                <i class="bi bi-info-circle me-1"></i>
                                Esta cotización tiene una <strong>validez de 7 días</strong>. No bloquea stock.
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100">
                                <i class="bi bi-file-earmark-text me-2"></i>Generar cotización
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-5">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-4">
                        <h5 class="fw-bold mb-3">Resumen</h5>
                        <ul class="list-group list-group-flush mb-3">
                            <li class="list-group-item d-flex justify-content-between px-0" th:each="item : ${items}">
                                <span>
                                    <span th:text="${item.producto.nombre}">Producto</span>
                                    <small class="text-muted" th:text="' x' + ${item.cantidad}">x1</small>
                                </span>
                                <strong th:text="'S/ ' + ${item.subtotal}">S/ 0.00</strong>
                            </li>
                        </ul>
                        <div class="d-flex justify-content-between fs-5 border-top pt-3">
                            <span class="fw-bold">Total (con IGV)</span>
                            <span class="fw-bold text-primary" th:text="'S/ ' + ${total * 1.18}">S/ 0.00</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/footer :: footer}"></div>
    <div th:replace="~{fragments/modal-cuenta :: modalCuenta}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
