<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Iniciar Sesión')}"></head>

<body class="login-bg">

    <div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <div class="row w-100 justify-content-center">
            <div class="col-md-7 col-lg-5 col-xl-4">

                <!-- Logo / Marca -->
                <div class="text-center mb-4">
                    <a th:href="@{/}" class="text-decoration-none">
                        <h1 class="fw-bold text-white mb-1">
                            <i class="bi bi-pc-display me-2"></i>Korvia
                        </h1>
                        <p class="text-white-50 small mb-0">Tecnología de alto rendimiento</p>
                    </a>
                </div>

                <!-- Card -->
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">
                            <div class="icon-circle bg-primary mx-auto mb-3">
                                <i class="bi bi-person-circle text-white" style="font-size: 2rem;"></i>
                            </div>
                            <h3 class="fw-bold mb-1">Iniciar Sesión</h3>
                            <p class="text-muted small mb-0">Ingresa tus credenciales para continuar</p>
                        </div>

                        <!-- Mensajes -->
                        <div th:if="${mensaje}" class="alert alert-success small">
                            <i class="bi bi-check-circle me-1"></i>
                            <span th:text="${mensaje}">Mensaje</span>
                        </div>
                        <div th:if="${error}" class="alert alert-danger small">
                            <i class="bi bi-exclamation-triangle me-1"></i>
                            <span th:text="${error}">Error</span>
                        </div>

                        <!-- Form -->
                        <form th:action="@{/login}" method="post">

                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Correo Electrónico</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0">
                                        <i class="bi bi-envelope text-muted"></i>
                                    </span>
                                    <input type="email" name="email" class="form-control border-start-0"
                                        placeholder="tucorreo@ejemplo.com" required autocomplete="email">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0">
                                        <i class="bi bi-lock text-muted"></i>
                                    </span>
                                    <input type="password" name="password" class="form-control border-start-0"
                                        placeholder="••••••••" required minlength="6" autocomplete="current-password">
                                </div>
                            </div>

                            <div class="d-flex justify-content-between align-items-center mb-4">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="recordarme">
                                    <label class="form-check-label small" for="recordarme">Recordarme</label>
                                </div>
                                <a href="#" class="small text-decoration-none">¿Olvidaste tu contraseña?</a>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Ingresar
                            </button>
                        </form>

                        <hr class="my-4">

                        <div class="text-center">
                            <p class="mb-2 small text-muted">¿No tienes cuenta?</p>
                            <a th:href="@{/registro}" class="btn btn-outline-primary w-100 fw-semibold">
                                <i class="bi bi-person-plus me-2"></i>Crear cuenta nueva
                            </a>
                        </div>

                        <!-- Credenciales de prueba -->
                        <div class="alert alert-info small mt-4 mb-0">
                            <strong><i class="bi bi-info-circle me-1"></i>Credenciales de prueba:</strong>
                            <ul class="mb-0 mt-2 small">
                                <li><strong>Admin:</strong> admin@korvia.pe / admin123</li>
                                <li><strong>Cliente:</strong> juan@email.com / 123456</li>
                            </ul>
                        </div>
                    </div>
                </div>

                <!-- Volver -->
                <div class="text-center mt-4">
                    <a th:href="@{/}" class="text-white-50 small text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i>Volver al inicio
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/modal-cuenta :: modalCuenta}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
