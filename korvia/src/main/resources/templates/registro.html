<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/head :: head('Registro')}"></head>

<body class="login-bg">

    <div class="container min-vh-100 d-flex align-items-center justify-content-center py-5">
        <div class="row w-100 justify-content-center">
            <div class="col-md-8 col-lg-6 col-xl-5">

                <!-- Logo / Marca -->
                <div class="text-center mb-4">
                    <a th:href="@{/}" class="text-decoration-none">
                        <h1 class="fw-bold text-white mb-1">
                            <i class="bi bi-pc-display me-2"></i>Korvia
                        </h1>
                        <p class="text-white-50 small mb-0">Tecnología de alto rendimiento</p>
                    </a>
                </div>

                <!-- Card -->
                <div class="card shadow-lg border-0 rounded-4">
                    <div class="card-body p-4 p-md-5">

                        <div class="text-center mb-4">
                            <div class="icon-circle bg-success mx-auto mb-3"
                                style="box-shadow: 0 4px 12px rgba(25, 135, 84, 0.3);">
                                <i class="bi bi-person-plus-fill text-white" style="font-size: 2rem;"></i>
                            </div>
                            <h3 class="fw-bold mb-1">Crear Cuenta</h3>
                            <p class="text-muted small mb-0">Regístrate para comprar y gestionar tus pedidos</p>
                        </div>

                        <!-- Form -->
                        <form th:action="@{/registro}" method="post">

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold">Nombres</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0">
                                            <i class="bi bi-person text-muted"></i>
                                        </span>
                                        <input type="text" name="nombre" class="form-control border-start-0"
                                            placeholder="Juan" required minlength="2" autocomplete="given-name">
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label small fw-semibold">Apellidos</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0">
                                            <i class="bi bi-person text-muted"></i>
                                        </span>
                                        <input type="text" name="apellido" class="form-control border-start-0"
                                            placeholder="Pérez" required minlength="2" autocomplete="family-name">
                                    </div>
                                </div>
                            </div>

                            <div class="mb-3 mt-3">
                                <label class="form-label small fw-semibold">Correo Electrónico</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0">
                                        <i class="bi bi-envelope text-muted"></i>
                                    </span>
                                    <input type="email" name="emailReg" class="form-control border-start-0"
                                        placeholder="tucorreo@ejemplo.com" required autocomplete="email">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label class="form-label small fw-semibold">Contraseña</label>
                                <div class="input-group">
                                    <span class="input-group-text bg-light border-end-0">
                                        <i class="bi bi-lock text-muted"></i>
                                    </span>
                                    <input type="password" name="passwordReg" class="form-control border-start-0"
                                        placeholder="Mínimo 6 caracteres" required minlength="6"
                                        autocomplete="new-password">
                                </div>
                                <small class="text-muted">Mínimo 6 caracteres</small>
                            </div>

                            <div class="form-check mb-4 mt-3">
                                <input class="form-check-input" type="checkbox" id="aceptoTerminos" required>
                                <label class="form-check-label small" for="aceptoTerminos">
                                    Acepto los <a href="#" class="text-decoration-none">términos y condiciones</a>
                                    y la <a href="#" class="text-decoration-none">política de privacidad</a>
                                </label>
                            </div>

                            <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                                <i class="bi bi-person-plus me-2"></i>Crear cuenta
                            </button>
                        </form>

                        <hr class="my-4">

                        <div class="text-center">
                            <p class="mb-2 small text-muted">¿Ya tienes una cuenta?</p>
                            <a th:href="@{/login}" class="btn btn-outline-primary w-100 fw-semibold">
                                <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión
                            </a>
                        </div>
                    </div>
                </div>

                <!-- Volver -->
                <div class="text-center mt-4">
                    <a th:href="@{/}" class="text-white-50 small text-decoration-none">
                        <i class="bi bi-arrow-left me-1"></i>Volver al inicio
                    </a>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{fragments/modal-cuenta :: modalCuenta}"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
