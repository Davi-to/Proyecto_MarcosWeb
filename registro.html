<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Registro - Korvia</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Carga de Bootstrap Icons para mejorar el aspecto visual con íconos -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>

<body class="bg-light">
    <!-- Menú de navegación completo-->
    <!-- sticky-top: Hace que la barra de navegación se quede pegada en la parte superior al hacer scroll -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <!-- container-fluid: Ocupa el 100% del ancho de la pantalla -->
        <div class="container-fluid">
            <!-- navbar-brand: El logotipo o nombre principal -->
            <a class="navbar-brand" href="index.html">
                <!-- bi bi-pc-display: Icono de Bootstrap. me-2: Margin end 2, separa el icono del texto -->
                <i class="bi bi-pc-display me-2"></i>Korvia
            </a>
            <!-- Botón hamburguesa para dispositivos móviles -->
            <!-- navbar-toggler: Estilo base para el botón. -->
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <!-- navbar-toggler-icon: El ícono de tres líneas (hamburguesa) -->
                <span class="navbar-toggler-icon"></span>
            </button>
            <!-- collapse navbar-collapse: Agrupa y oculta el menú en pantallas pequeñas -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- ms-auto: Alinea las opciones del menú a la derecha -->
                <ul class="navbar-nav ms-auto">
                    <!-- nav-item: Elemento de lista. nav-link: Estiliza el enlace -->
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalogo.html">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                    <!-- nav-link active: Resalta que esta es la página actual -->
                    <li class="nav-item"><a class="nav-link active" href="#" data-bs-toggle="modal"
                            data-bs-target="#accountModal">Mi cuenta</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- container mt-5: Contenedor principal con margen superior 5 -->
    <div class="container mt-5">
        <!-- row justify-content-center: Fila que centra horizontalmente su contenido -->
        <div class="row justify-content-center">
            <!-- col-md-8 col-lg-6: Como este formulario tiene más campos, le damos 6 columnas en escritorio en lugar de 4, haciéndolo más ancho[cite: 1] -->
            <div class="col-md-8 col-lg-6">
                <!-- card shadow: Componente de tarjeta con sombra sutil -->
                <div class="card shadow">
                    <!-- card-body: Contenedor interior de la tarjeta con padding -->
                    <div class="card-body">
                        <!-- card-title text-center mb-4: Título de la tarjeta centrado y con margen inferior -->
                        <h4 class="card-title text-center mb-4">Registro de Usuario</h4>
                        <form action="login.html">
                            <!-- row dentro del form: Permite poner campos uno al lado del otro en la misma línea[cite: 1] -->
                            <div class="row">
                                <!-- col-md-6: Cada campo (Nombre y Apellido) ocupará la mitad (6 de 12) del espacio. En celular bajarán automáticamente uno sobre otro[cite: 1] -->
                                <div class="col-md-6 mb-3">
                                    <!-- form-label: Estilo de etiqueta de formulario -->
                                    <label for="nombre" class="form-label">Nombres</label>
                                    <!-- form-control: Estilo de campo de entrada que ocupa el 100% del ancho -->
                                    <input type="text" class="form-control" id="nombre" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="apellido" class="form-label">Apellidos</label>
                                    <input type="text" class="form-control" id="apellido" required>
                                </div>
                            </div>
                            <!-- mb-3: Margen inferior 3 para separar campos -->
                            <div class="mb-3">
                                <label for="emailReg" class="form-label">Correo Electrónico</label>
                                <input type="email" class="form-control" id="emailReg" required>
                            </div>
                            <div class="mb-3">
                                <label for="passwordReg" class="form-label">Contraseña</label>
                                <input type="password" class="form-control" id="passwordReg" required>
                            </div>
                            <!-- btn btn-primary w-100: Botón principal azul que ocupa todo el ancho -->
                            <button type="submit" class="btn btn-primary w-100">Crear Cuenta</button>
                        </form>
                        <!-- mt-3 text-center: Margen superior y texto centrado -->
                        <div class="mt-3 text-center">
                            <a href="login.html">¿Ya tienes cuenta? Inicia sesión</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Mi cuenta -->
    <!-- Modal Mi cuenta -->
    <!-- modal: Estructura base de ventana emergente. fade: Agrega animación de desvanecimiento -->
    <div class="modal fade" id="accountModal" tabindex="-1">
        <!-- modal-dialog: Contenedor principal. modal-sm: Tamaño pequeño. modal-dialog-centered: Centra verticalmente -->
        <div class="modal-dialog modal-sm modal-dialog-centered">
            <!-- modal-content: Contenedor con estilos de tarjeta para el contenido del modal -->
            <div class="modal-content">
                <!-- modal-header: Área superior del modal -->
                <div class="modal-header">
                    <!-- modal-title: Estiliza el texto como título -->
                    <h5 class="modal-title">Mi cuenta</h5>
                    <!-- btn-close: Botón con forma de X para cerrar el modal -->
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <!-- modal-body: Área principal. text-center: Centra el texto -->
                <div class=" modal-body text-center">
                    <!-- btn btn-primary: Botón principal azul. w-100: Ocupa todo el ancho. mb-3: Margen inferior -->
                    <a href="login.html" class="btn btn-primary w-100 mb-3">Iniciar Sesión</a>
                    <!-- btn btn-outline-secondary: Botón gris con fondo transparente. w-100: Ocupa todo el ancho -->
                    <a href="registro.html" class="btn btn-outline-secondary w-100">Registrarme</a>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
